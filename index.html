<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Hisab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Smart Hisab 🧮</h1>
        <div id="display" class="display-box">
            <p id="instruction">Tap the mic and say something like:<br>"1999 ka 3 percent kitna hoga?"</p>
            <div id="steps" class="steps"></div>
            <div id="result" class="result"></div>
        </div>
        
        <div class="controls">
            <button id="mic-btn">🎤 Start Speaking</button>
            <input type="text" id="type-input" placeholder="Ya phir yahan type karein...">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
