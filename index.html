<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart AI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-shell">
        <div class="display-panel glass">
            <div id="displayExpression" class="expression">0</div>
            <div id="displayResult" class="result">0.00</div>
        </div>

        <div class="buttons-grid">
            <button class="btn btn-op" onclick="clearDisplay()">AC</button>
            <button class="btn btn-op" onclick="appendInput('/')">÷</button>
            <button class="btn btn-op" onclick="appendInput('*')">×</button>
            <button class="btn btn-op" onclick="backspace()">⌫</button>
            
            <button class="btn" onclick="appendInput('7')">7</button>
            <button class="btn" onclick="appendInput('8')">8</button>
            <button class="btn" onclick="appendInput('9')">9</button>
            <button class="btn btn-op" onclick="appendInput('-')">−</button>
            
            <button class="btn" onclick="appendInput('4')">4</button>
            <button class="btn" onclick="appendInput('5')">5</button>
            <button class="btn" onclick="appendInput('6')">6</button>
            <button class="btn btn-op" onclick="appendInput('+')">+</button>
            
            <button class="btn" onclick="appendInput('1')">1</button>
            <button class="btn" onclick="appendInput('2')">2</button>
            <button class="btn" onclick="appendInput('3')">3</button>
            <button class="btn btn-equal" onclick="calculate()">=</button>
            
            <button class="btn btn-zero" onclick="appendInput('0')">0</button>
            <button class="btn" onclick="appendInput('.')">.</button>
        </div>

        <div class="voice-section">
            <button id="mic-btn" class="mic-btn-main">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <p id="status-text">Boliye "500 ka 10 percent"</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
