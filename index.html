<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a14" />
  <meta name="description" content="AI Voice Financial Calculator — GST, EMI, Discount & more with Hindi voice support" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VoiceCalc" />

  <title>AI Voice Financial Calculator</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="assets/icon.png" />
  <link rel="icon" type="image/png" href="assets/icon.png" />

  <!-- Google Fonts — Sora + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  
</head>
<body>

  <!-- Background ambient blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <!-- ═══════════════════ APP SHELL ═══════════════════ -->
  <div class="app-shell" id="appShell">

    <!-- ── Header ── -->
    <header class="app-header">
      <div class="header-logo">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="10" stroke="url(#logoGrad)" stroke-width="2"/>
          <path d="M7 11h8M11 7v8" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="22" y2="22">
              <stop stop-color="#6ee7ff"/>
              <stop offset="1" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
        </svg>
        <span>VoiceCalc</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button class="btn-icon" id="btnHistory" title="History" aria-label="Show history">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Display Panel ── -->
    <section class="display-panel glass" aria-label="Calculator display">
      <div class="display-mode-badge" id="displayMode">Calculator</div>
      <div class="display-expression" id="displayExpression" aria-live="polite">0</div>
      <div class="display-result" id="displayResult" aria-live="polite"></div>
      <div class="display-steps" id="displaySteps" aria-live="polite"></div>
      <!-- Voice listening indicator -->
      <div class="voice-listening-badge" id="voiceListeningBadge" hidden>
        <span class="dot"></span> Listening…
      </div>
    </section>

    <!-- ── Tab Navigation ── -->
    <nav class="tab-nav" role="tablist" aria-label="Calculator modes">
      <button class="tab-btn active" role="tab" aria-selected="true" data-tab="calc">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="9" y1="9" x2="9" y2="9"/><line x1="15" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="9" y2="15"/><line x1="15" y1="15" x2="15" y2="15"/></svg>
        Calc
      </button>
      <button class="tab-btn" role="tab" aria-selected="false" data-tab="finance">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Finance
      </button>
      <button class="tab-btn" role="tab" aria-selected="false" data-tab="history">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        History
      </button>
    </nav>

    <!-- ════════════ TAB: CALCULATOR ════════════ -->
    <section class="tab-panel active" id="tab-calc" role="tabpanel">

      <!-- Standard Keypad -->
      <div class="keypad" id="keypad">
        <!-- Row 1 -->
        <button class="key key-function" data-action="clear">AC</button>
        <button class="key key-function" data-action="sign">+/−</button>
        <button class="key key-function" data-action="percent">%</button>
        <button class="key key-operator" data-action="operator" data-value="÷">÷</button>
        <!-- Row 2 -->
        <button class="key" data-action="digit" data-value="7">7</button>
        <button class="key" data-action="digit" data-value="8">8</button>
        <button class="key" data-action="digit" data-value="9">9</button>
        <button class="key key-operator" data-action="operator" data-value="×">×</button>
        <!-- Row 3 -->
        <button class="key" data-action="digit" data-value="4">4</button>
        <button class="key" data-action="digit" data-value="5">5</button>
        <button class="key" data-action="digit" data-value="6">6</button>
        <button class="key key-operator" data-action="operator" data-value="−">−</button>
        <!-- Row 4 -->
        <button class="key" data-action="digit" data-value="1">1</button>
        <button class="key" data-action="digit" data-value="2">2</button>
        <button class="key" data-action="digit" data-value="3">3</button>
        <button class="key key-operator" data-action="operator" data-value="+">+</button>
        <!-- Row 5 -->
        <button class="key key-wide" data-action="digit" data-value="0">0</button>
        <button class="key" data-action="decimal">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </div>

      <!-- Voice Button -->
      <div class="voice-section">
        <button class="mic-btn" id="micBtn" aria-label="Start voice input" title="Speak a calculation">
          <div class="mic-rings">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
          </div>
          <div class="mic-core">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </div>
        </button>
        <div class="voice-wave" id="voiceWave" hidden>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="voice-hint" id="voiceHint">Tap mic &amp; say "1999 ka 3 percent" or "EMI 5 lakh 10 percent 24 months"</p>
        <p class="voice-transcript" id="voiceTranscript"></p>
      </div>
    </section>

    <!-- ════════════ TAB: FINANCE ════════════ -->
    <section class="tab-panel" id="tab-finance" role="tabpanel" hidden>
      <div class="finance-grid">

        <!-- GST -->
        <button class="finance-card" data-tool="gst">
          <div class="finance-card-icon">🧾</div>
          <div class="finance-card-label">GST</div>
          <div class="finance-card-desc">Goods &amp; Services Tax</div>
        </button>

        <!-- Discount -->
        <button class="finance-card" data-tool="discount">
          <div class="finance-card-icon">🏷️</div>
          <div class="finance-card-label">Discount</div>
          <div class="finance-card-desc">Sale price calculator</div>
        </button>

        <!-- Profit Margin -->
        <button class="finance-card" data-tool="profit">
          <div class="finance-card-icon">📈</div>
          <div class="finance-card-label">Profit</div>
          <div class="finance-card-desc">Margin &amp; profit %</div>
        </button>

        <!-- EMI -->
        <button class="finance-card" data-tool="emi">
          <div class="finance-card-icon">🏦</div>
          <div class="finance-card-label">EMI</div>
          <div class="finance-card-desc">Loan installment</div>
        </button>

        <!-- % Change -->
        <button class="finance-card" data-tool="percentchange">
          <div class="finance-card-icon">🔄</div>
          <div class="finance-card-label">% Change</div>
          <div class="finance-card-desc">Increase / decrease</div>
        </button>

        <!-- Simple Interest -->
        <button class="finance-card" data-tool="si">
          <div class="finance-card-icon">💹</div>
          <div class="finance-card-label">Interest</div>
          <div class="finance-card-desc">Simple interest</div>
        </button>

      </div>
    </section>

    <!-- ════════════ TAB: HISTORY ════════════ -->
    <section class="tab-panel" id="tab-history" role="tabpanel" hidden>
      <div class="history-header">
        <h2 class="history-title">Recent Calculations</h2>
        <button class="btn-clear-history" id="btnClearHistory">Clear All</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <p>No history yet</p>
        </div>
      </div>
    </section>

  </div><!-- /app-shell -->

  <!-- ════════════ MODALS ════════════ -->

  <!-- Finance Input Modal -->
  <div class="modal-overlay" id="financeModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal glass">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">GST Calculator</h3>
        <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Dynamic fields injected by JS -->
      </div>
      <div class="modal-result" id="modalResult" hidden>
        <!-- Result injected by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalCalculate">Calculate</button>
      </div>
    </div>
  </div>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner" hidden>
    <div class="install-banner-inner">
      <div class="install-banner-text">
        <strong>Install VoiceCalc</strong>
        <span>Add to home screen for offline use</span>
      </div>
      <div class="install-banner-actions">
        <button id="btnInstall" class="btn-primary btn-sm">Install</button>
        <button id="btnDismiss" class="btn-icon">×</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-logo">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <circle cx="28" cy="28" r="26" stroke="url(#lg1)" stroke-width="3"/>
        <path d="M20 28h16M28 20v16" stroke="url(#lg1)" stroke-width="3" stroke-linecap="round"/>
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="56" y2="56">
            <stop stop-color="#6ee7ff"/><stop offset="1" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <p class="loading-text">VoiceCalc</p>
  </div>

  <!-- JS Modules -->
  <script src="js/calculator.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/history.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
