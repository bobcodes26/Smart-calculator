<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Voice Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="header-logo">
                <span class="logo-text">VoiceCalc 2030</span>
            </div>
        </header>

        <section class="display-panel glass">
            <div class="display-badge" id="displayMode">AI Calculator</div>
            <div class="display-expression" id="displaySteps">Boliye... "1999 ka 3 percent"</div>
            <div class="display-result" id="displayResult">0</div>
        </section>

        <div class="main-content">
            <div class="mic-section">
                <button id="mic-btn" class="mic-btn-main">
                    <svg viewBox="0 0 24 24" width="35" height="35" fill="white">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <p id="status-text">Tap to Calculate</p>
            </div>
        </div>

        <nav class="tab-nav">
            <button class="tab-btn active">Calc</button>
            <button class="tab-btn">Finance</button>
            <button class="tab-btn">History</button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
